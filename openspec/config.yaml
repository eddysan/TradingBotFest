schema: spec-driven

context: |
  openspec/specs/ is a behavioral baseline of the current Rust bot, written from
  the working tree rather than from an approved target design. Requirements
  describe what the code does today. Suspected defects are recorded as
  "Known deviations" in the owning spec and in
  openspec/changes/baseline-audit/design.md; they are not approved intent.

  The Python implementation under assets/old_python/ is archived and is not
  run. The SQLite migrations, config/*.toml files, and
  openspec/changes/add-dca-safety-assistant/ are not live behavior. Do not
  treat any of them as requirements for current work.

  Any change that intentionally alters baseline behavior must name the
  affected capability and requirement, and must say whether it removes a
  known deviation or introduces a new one.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
