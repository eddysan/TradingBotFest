[package]
name = "trading_bot_fest_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }

# SQLx - async SQL with compile-time checked queries
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "rust_decimal"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"
rust_decimal = "1.34"
dotenvy = "0.15"
toml = "0.8"

binance-sdk = { version = "44.0.1", features = [
    "derivatives_trading_usds_futures",
    "spot",
] }
futures-util = "0.3"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.13.2", features = ["json"] }

